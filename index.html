<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AR Detect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0b0a; --ink:#ece7dd; --ink-dim:#948d7e;
    --accent:#ff4d2e;
    --line:rgba(236,231,221,.16);
    --panel:rgba(13,12,11,.52);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  body{font-family:"IBM Plex Sans Thai","IBM Plex Sans",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  video,canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
  /* บนล่างไล่เฉดดำจาง ให้ตัวเลข HUD อ่านออกทุกฉาก */
  body::before,body::after{content:"";position:fixed;left:0;right:0;pointer-events:none;z-index:1}
  body::before{top:0;height:128px;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent)}
  body::after{bottom:0;height:184px;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent)}

  .chip{
    position:fixed;z-index:2;
    font:500 13px/1.35 "IBM Plex Sans Thai","IBM Plex Sans",system-ui,sans-serif;
    color:var(--ink);background:var(--panel);
    -webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
    border:1px solid var(--line);border-radius:8px;padding:7px 12px;
  }
  .btn{
    position:fixed;z-index:2;width:46px;height:46px;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);background:var(--panel);
    -webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
    border:1px solid var(--line);border-radius:14px;cursor:pointer;
    transition:transform .14s ease,border-color .14s ease,color .14s ease;
  }
  .btn:active{transform:scale(.9)}
  .btn.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
  .btn svg,.chip svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  #status,#fps{
    font-family:"IBM Plex Mono","IBM Plex Sans Thai",ui-monospace,monospace;
    font-size:10.5px;font-weight:400;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-dim);background:transparent;border:0;
    -webkit-backdrop-filter:none;backdrop-filter:none;padding:2px 0;
  }
  #status{top:calc(16px + env(safe-area-inset-top));left:16px}
  #fps{top:calc(16px + env(safe-area-inset-top));right:16px}
  #status.load::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle;animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

  #count{
    top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    max-width:74vw;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border-left:2px solid var(--accent);border-radius:0 8px 8px 0;
  }

  #ctl{
    position:fixed;z-index:2;left:16px;bottom:calc(18px + env(safe-area-inset-bottom));
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:calc(100vw - 88px);
  }
  #ctl .chip{position:static;cursor:pointer}
  #arlink{display:inline-flex;align-items:center;gap:7px;text-decoration:none;letter-spacing:.06em}
  #arlink svg{width:16px;height:16px}
  #mode{display:inline-flex;align-items:center;gap:8px}
  #mode::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
  #labels{
    position:static;width:min(58vw,360px);
    font:500 13px/1.35 "IBM Plex Sans Thai","IBM Plex Sans",system-ui,sans-serif;
    color:var(--ink);background:rgba(13,12,11,.72);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:8px;padding:7px 12px;outline:none;
  }
  #labels::placeholder{color:var(--ink-dim)}
  #labels:focus{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}

  #flip{right:16px;bottom:calc(18px + env(safe-area-inset-bottom))}
  #snap{right:16px;bottom:calc(76px + env(safe-area-inset-bottom))}
  #voice{right:16px;bottom:calc(134px + env(safe-area-inset-bottom))}
  #voice .wave{display:none}
  #voice.on .wave{display:inline}
  #voice.on .slash{display:none}

  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .chip,.btn{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards}
  #snap{animation-delay:.04s}#voice{animation-delay:.08s}
</style>
</head>
<body>
<video id="cam" autoplay muted playsinline></video>
<canvas id="hud"></canvas>
<div id="status" class="chip load">กำลังโหลดโมเดล…</div>
<div id="fps" class="chip" hidden></div>
<button id="flip" class="btn" hidden aria-label="สลับกล้องหน้า/หลัง">
  <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 14.5-7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-14.5 7L3 16"/><path d="M3 21v-5h5"/></svg>
</button>
<button id="snap" class="btn" hidden aria-label="บันทึกภาพ">
  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></svg>
</button>
<button id="voice" class="btn" hidden aria-label="เปิด/ปิดเสียงพูด">
  <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5H4z"/><path class="wave" d="M16 9.5a3.5 3.5 0 0 1 0 5M18.7 7a7 7 0 0 1 0 10"/><path class="slash" d="M16.5 10l4.5 4.5M21 10l-4.5 4.5"/></svg>
</button>
<div id="count" class="chip" hidden></div>
<div id="ctl" hidden>
  <a href="ar.html" class="chip" id="arlink"><svg viewBox="0 0 24 24"><path d="M12 2 3 6.5v11L12 22l9-4.5v-11z"/><path d="M3 6.5 12 11l9-4.5M12 11v11"/></svg>AR</a>
  <button id="mode" class="chip">โหมด: เร็ว (80 ชนิด)</button>
  <input id="labels" hidden value="ปลั๊กไฟ, esp32, raspberry pi, ขวดน้ำ, คอม, แอปเปิ้ล" aria-label="ชื่อของที่จะตรวจจับ">
</div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2/dist/coco-ssd.min.js"></script>
<script>
const cam = document.getElementById('cam'), hud = document.getElementById('hud');
const statusEl = document.getElementById('status'), fpsEl = document.getElementById('fps');
const flipBtn = document.getElementById('flip'), ctx = hud.getContext('2d');
const ctlEl = document.getElementById('ctl'), modeBtn = document.getElementById('mode'), labelsIn = document.getElementById('labels');
const snapBtn = document.getElementById('snap'), voiceBtn = document.getElementById('voice'), countEl = document.getElementById('count');

const TH = {person:'คน',bicycle:'จักรยาน',car:'รถยนต์',motorcycle:'มอเตอร์ไซค์',airplane:'เครื่องบิน',bus:'รถเมล์',train:'รถไฟ',truck:'รถบรรทุก',boat:'เรือ','traffic light':'ไฟจราจร','fire hydrant':'หัวดับเพลิง','stop sign':'ป้ายหยุด','parking meter':'มิเตอร์จอดรถ',bench:'ม้านั่ง',bird:'นก',cat:'แมว',dog:'หมา',horse:'ม้า',sheep:'แกะ',cow:'วัว',elephant:'ช้าง',bear:'หมี',zebra:'ม้าลาย',giraffe:'ยีราฟ',backpack:'เป้',umbrella:'ร่ม',handbag:'กระเป๋าถือ',tie:'เนคไท',suitcase:'กระเป๋าเดินทาง',frisbee:'จานร่อน',skis:'สกี',snowboard:'สโนว์บอร์ด','sports ball':'ลูกบอล',kite:'ว่าว','baseball bat':'ไม้เบสบอล','baseball glove':'ถุงมือเบสบอล',skateboard:'สเก็ตบอร์ด',surfboard:'เซิร์ฟบอร์ด','tennis racket':'ไม้เทนนิส',bottle:'ขวด','wine glass':'แก้วไวน์',cup:'แก้ว',fork:'ส้อม',knife:'มีด',spoon:'ช้อน',bowl:'ชาม',banana:'กล้วย',apple:'แอปเปิล',sandwich:'แซนด์วิช',orange:'ส้ม',broccoli:'บรอกโคลี',carrot:'แครอท','hot dog':'ฮอตดอก',pizza:'พิซซ่า',donut:'โดนัท',cake:'เค้ก',chair:'เก้าอี้',couch:'โซฟา','potted plant':'ต้นไม้กระถาง',bed:'เตียง','dining table':'โต๊ะกินข้าว',toilet:'ชักโครก',tv:'ทีวี',laptop:'โน้ตบุ๊ก',mouse:'เมาส์',remote:'รีโมต',keyboard:'คีย์บอร์ด','cell phone':'มือถือ',microwave:'ไมโครเวฟ',oven:'เตาอบ',toaster:'เครื่องปิ้งขนมปัง',sink:'ซิงก์',refrigerator:'ตู้เย็น',book:'หนังสือ',clock:'นาฬิกา',vase:'แจกัน',scissors:'กรรไกร','teddy bear':'ตุ๊กตาหมี','hair drier':'ไดร์เป่าผม',toothbrush:'แปรงสีฟัน'};

// พิมพ์ไทยในโหมด zero-shot ได้ — แปลงเป็น prompt อังกฤษให้ (โมเดลรู้แค่อังกฤษ)
const TH2EN = {'ปลั๊กไฟ':'power outlet','ปลั๊ก':'power plug','สายไฟ':'electric cable','esp32':'esp32 microcontroller board','pi':'raspberry pi board','raspberry pi':'raspberry pi board','บอร์ด':'electronic circuit board','ขวดน้ำ':'water bottle','ขวด':'bottle','คอม':'laptop computer','คอมพิวเตอร์':'desktop computer','โน้ตบุ๊ก':'laptop','จอ':'computer monitor','คีย์บอร์ด':'computer keyboard','เมาส์':'computer mouse','แอปเปิ้ล':'apple','แอปเปิล':'apple','มือถือ':'mobile phone','โทรศัพท์':'mobile phone','หูฟัง':'headphones','ปากกา':'pen','แก้วน้ำ':'drinking glass','รองเท้า':'shoe','พัดลม':'electric fan'};

// ป้าย + กรอบ: โทนโมโนโครม เส้นบาง ป้ายแบนมีสันสีส้ม — เลี่ยงกรอบสายรุ้งสุ่มสีที่ดูออกว่า generate
function drawBoxes(preds) {
  const s = hud.width / 1280;
  const lw = Math.max(1.5, 2 * s), fs = Math.max(13, 15 * s);
  const fSans = `500 ${fs}px "IBM Plex Sans Thai","IBM Plex Sans",system-ui,sans-serif`;
  const fMono = `500 ${fs}px "IBM Plex Mono",ui-monospace,monospace`;
  ctx.textBaseline = 'alphabetic';
  for (const p of preds) {
    const [x, y, w, h] = p.bbox;
    ctx.lineWidth = lw;
    ctx.strokeStyle = 'rgba(236,231,221,.9)';
    ctx.fillStyle = 'rgba(236,231,221,.05)';
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 3 * s);
    ctx.fill(); ctx.stroke();

    const name = TH[p.class] || p.class, pct = Math.round(p.score * 100) + '%';
    ctx.font = fSans; const nameW = ctx.measureText(name).width;
    ctx.font = fMono; const pctW = ctx.measureText(pct).width;
    const padX = fs * 0.55, gap = fs * 0.5, bh = fs * 1.6;
    const bw = padX * 2 + nameW + gap + pctW;
    let by = y - bh; if (by < 2) by = y + lw;
    const bx = Math.max(2, Math.min(x, hud.width - bw - 2));
    ctx.fillStyle = 'rgba(12,11,10,.82)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#ff4d2e';
    ctx.fillRect(bx, by, Math.max(2, lw), bh);
    const ty = by + bh / 2 + fs * 0.36;
    ctx.fillStyle = '#ece7dd'; ctx.font = fSans;
    ctx.fillText(name, bx + padX, ty);
    ctx.fillStyle = '#b7b0a1'; ctx.font = fMono;
    ctx.fillText(pct, bx + padX + nameW + gap, ty);
  }
}

let stream = null, facing = 'environment';
async function startCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: {facingMode: facing, width: {ideal: 1280}, height: {ideal: 720}}, audio: false
  });
  cam.srcObject = stream;
  await new Promise(r => cam.onloadedmetadata = r);
  hud.width = cam.videoWidth; hud.height = cam.videoHeight;
}

// ---------- เสียงพูดไทยตอนเจอของใหม่ ----------
let voiceOn = false;
const lastSpoken = {};
function announce(cls) {
  if (!voiceOn) return;
  const now = performance.now();
  if (lastSpoken[cls] && now - lastSpoken[cls] < 4000) return;
  lastSpoken[cls] = now;
  const u = new SpeechSynthesisUtterance(TH[cls] || cls);
  u.lang = 'th-TH'; u.rate = 1.1;
  speechSynthesis.speak(u);
}

// ---------- ตัวนับวัตถุ ----------
function updateCount(preds) {
  const m = {};
  for (const p of preds) { const n = TH[p.class] || p.class; m[n] = (m[n] || 0) + 1; }
  countEl.textContent = Object.entries(m).map(([k, v]) => v > 1 ? `${k}×${v}` : k).join(' · ');
  countEl.hidden = !preds.length;
}

// ---------- tracking smoothing: กรอบไหลตามของ ไม่กระตุก ----------
// ponytail: greedy class+IoU match ก็พอ — ถ้าของชนิดเดียวกันเดินสลับตัวกันค่อยว่ากัน
let tracks = [];
function smooth(preds) {
  for (const t of tracks) { t.miss++; t.matched = false; }
  for (const p of preds) {
    let best = null, bi = 0.3;
    for (const t of tracks) {
      if (t.class !== p.class || t.matched) continue;
      const i = iouOf(t, p);
      if (i > bi) { bi = i; best = t; }
    }
    if (best) {
      best.to = [...p.bbox];
      best.score = p.score; best.miss = 0; best.matched = true;
    } else {
      tracks.push({class: p.class, score: p.score, bbox: [...p.bbox], to: [...p.bbox], miss: 0, matched: true});
      announce(p.class);
    }
  }
  tracks = tracks.filter(t => t.miss < 4);
  return tracks;
}

// ---------- โหมดเร็ว: COCO-SSD ----------
// ponytail: ตัวทำเครื่องร้อนคือโมเดล ไม่ใช่การวาด — detect ~7 ครั้ง/วิ พอ
// กรอบ lerp เข้าหาเป้าทุกเฟรมวาด (30fps) เลยยังลื่นเท่าเดิมแต่ GPU ทำงานน้อยลง ~4 เท่า
const DETECT_MS = 150, DRAW_MS = 1000 / 30;
let cocoModel = null, mode = 'coco', lastDetect = 0, lastDraw = 0, detecting = false;
function cocoLoop(ts = 0) {
  if (mode !== 'coco') return;
  requestAnimationFrame(cocoLoop);
  if (!detecting && ts - lastDetect >= DETECT_MS) {
    detecting = true; lastDetect = ts;
    cocoModel.detect(cam, 20, 0.5).then(preds => {
      detecting = false;
      if (mode === 'coco') updateCount(smooth(preds));
    }, e => { detecting = false; console.error(e); });
  }
  if (ts - lastDraw < DRAW_MS) return;
  if (lastDraw) fpsEl.textContent = Math.round(1000 / (ts - lastDraw)) + ' fps';
  lastDraw = ts;
  for (const t of tracks) for (let k = 0; k < 4; k++) t.bbox[k] += (t.to[k] - t.bbox[k]) * 0.25;
  ctx.clearRect(0, 0, hud.width, hud.height);
  drawBoxes(tracks);
}

// ---------- โหมดพิมพ์เอง: OWLv2 zero-shot ----------
// ponytail: owlv2 ช้า (วินาทีต่อเฟรม) — ถ้าอยากเรียลไทม์ค่อยเทรน YOLO custom
const ZS_MODEL = 'Xenova/owlv2-base-patch16-ensemble', ZS_TH = 0.2;
let zsD = null;
async function loadZS() {
  const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3');
  try { return await pipeline('zero-shot-object-detection', ZS_MODEL, {device: 'webgpu'}); }
  catch (e) { console.warn('webgpu ไม่ได้ ใช้ wasm', e); return await pipeline('zero-shot-object-detection', ZS_MODEL); }
}
function iouOf(a, b) {
  const ix = Math.max(0, Math.min(a.bbox[0] + a.bbox[2], b.bbox[0] + b.bbox[2]) - Math.max(a.bbox[0], b.bbox[0]));
  const iy = Math.max(0, Math.min(a.bbox[1] + a.bbox[3], b.bbox[1] + b.bbox[3]) - Math.max(a.bbox[1], b.bbox[1]));
  const inter = ix * iy;
  return inter / (a.bbox[2] * a.bbox[3] + b.bbox[2] * b.bbox[3] - inter);
}
function nms(preds) {
  const out = [];
  for (const p of preds.sort((a, b) => b.score - a.score))
    if (!out.some(o => o.class === p.class && iouOf(o, p) > 0.5)) out.push(p);
  return out;
}
function parseLabels(str) {
  return str.split(',').map(s => s.trim()).filter(Boolean)
    .map(s => ({display: s, en: TH2EN[s.toLowerCase()] || s}));
}
function zsToPred(o, items) {
  const it = items.find(i => i.en === o.label);
  return {bbox: [o.box.xmin, o.box.ymin, o.box.xmax - o.box.xmin, o.box.ymax - o.box.ymin],
          class: it ? it.display : o.label, score: o.score};
}
const fc = document.createElement('canvas');
function grabFrame() {
  fc.width = cam.videoWidth; fc.height = cam.videoHeight;
  fc.getContext('2d').drawImage(cam, 0, 0);
  return fc.toDataURL('image/jpeg', 0.8);
}
async function zsLoop() {
  if (mode !== 'zs') return;
  if (document.hidden) return setTimeout(zsLoop, 500);
  try {
    const t0 = performance.now();
    const items = parseLabels(labelsIn.value);
    if (items.length) {
      const out = await zsD(grabFrame(), items.map(i => i.en), {threshold: ZS_TH, top_k: 24});
      if (mode !== 'zs') return;
      const preds = nms(out.map(o => zsToPred(o, items)));
      ctx.clearRect(0, 0, hud.width, hud.height);
      drawBoxes(preds);
      updateCount(preds);
      preds.forEach(p => announce(p.class));
      fpsEl.textContent = ((performance.now() - t0) / 1000).toFixed(1) + ' วิ/เฟรม';
    }
    setTimeout(zsLoop, 300); // พักให้ชิปเย็นระหว่างเฟรม — เฟรมนึงกินเป็นวิอยู่แล้ว ไม่ทันสังเกต
  } catch (e) {
    statusEl.hidden = false; statusEl.classList.remove('load');
    statusEl.textContent = 'zero-shot พัง: ' + e.message; console.error(e);
  }
}

async function switchMode() {
  tracks = [];
  if (mode === 'coco') {
    mode = 'zs'; modeBtn.textContent = 'โหมด: พิมพ์เอง 🐢'; labelsIn.hidden = false;
    if (!zsD) {
      statusEl.hidden = false; statusEl.classList.add('load');
      statusEl.textContent = 'โหลดโมเดล zero-shot ครั้งแรก (~100MB รอหน่อย)…';
      zsD = await loadZS();
      statusEl.hidden = true; statusEl.classList.remove('load');
    }
    zsLoop();
  } else {
    mode = 'coco'; modeBtn.textContent = 'โหมด: เร็ว (80 ชนิด)'; labelsIn.hidden = true;
    cocoLoop();
  }
}

// ponytail: ?img=file.jpg[&labels=a,b] = still-image self-check mode, used by tests
async function testImage(src, labels) {
  cam.style.display = 'none';
  hud.style.objectFit = 'contain';
  const img = new Image(); img.src = src; await img.decode();
  hud.width = img.naturalWidth; hud.height = img.naturalHeight;
  let preds;
  if (labels) {
    statusEl.textContent = 'โหลด zero-shot…';
    const zs = await loadZS();
    const items = parseLabels(labels);
    const out = await zs(new URL(src, location.href).href, items.map(i => i.en), {threshold: ZS_TH, top_k: 24});
    preds = nms(out.map(o => zsToPred(o, items)));
  } else {
    preds = await cocoModel.detect(img, 20, 0.5);
  }
  ctx.drawImage(img, 0, 0);
  drawBoxes(preds);
  updateCount(preds);
  statusEl.hidden = true; statusEl.classList.remove('load');
  console.log('TEST_RESULT ' + JSON.stringify(preds.map(p => [p.class, +p.score.toFixed(2)])));
}

(async () => {
  try {
    const [m] = await Promise.all([cocoSsd.load(), document.fonts.ready]);
    cocoModel = m;
    const q = new URLSearchParams(location.search);
    if (q.get('img')) return testImage(q.get('img'), q.get('labels'));
    statusEl.textContent = 'ขอสิทธิ์กล้อง…';
    await startCam();
    statusEl.hidden = true; statusEl.classList.remove('load');
    fpsEl.hidden = false; flipBtn.hidden = false; ctlEl.hidden = false;
    snapBtn.hidden = false; voiceBtn.hidden = !('speechSynthesis' in window);
    flipBtn.onclick = async () => { facing = facing === 'environment' ? 'user' : 'environment'; tracks = []; await startCam(); };
    modeBtn.onclick = switchMode;
    snapBtn.onclick = () => {
      const c = document.createElement('canvas');
      c.width = hud.width; c.height = hud.height;
      const g = c.getContext('2d');
      g.drawImage(cam, 0, 0, c.width, c.height);
      g.drawImage(hud, 0, 0);
      const a = document.createElement('a');
      a.download = 'ar-detect-' + new Date().toISOString().replace(/[:.]/g, '-') + '.png';
      a.href = c.toDataURL('image/png');
      a.click();
    };
    voiceBtn.onclick = () => {
      voiceOn = !voiceOn;
      voiceBtn.classList.toggle('on', voiceOn);
      if (voiceOn) { const u = new SpeechSynthesisUtterance('เปิดเสียงแล้ว'); u.lang = 'th-TH'; speechSynthesis.speak(u); }
      else speechSynthesis.cancel();
    };
    cocoLoop();
  } catch (e) {
    statusEl.textContent = 'เปิดไม่สำเร็จ: ' + e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
